services:
  - type: web
    name: pancreavision-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: pancreas_app_db
      - key: PYTHON_VERSION
        value: 3.11.8
